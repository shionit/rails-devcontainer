name: Dependency Review

# Run on every pull request to catch new dependencies with known
# vulnerabilities before they are merged.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  # Required to post the vulnerability summary as a PR comment
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0d381219ddf674d61a7572ddd19d7941e271515c  # v2.9.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8  # v4.6.0
        with:
          # Block PRs that introduce packages with critical or high CVEs
          fail-on-severity: high
          # Post a detailed comment on the PR with the findings
          comment-summary-in-pr: always
