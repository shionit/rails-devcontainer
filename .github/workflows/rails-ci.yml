name: Rails CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Principle of least privilege: restrict the default GITHUB_TOKEN to read-only.
# Individual jobs can elevate permissions only as needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Job-level permissions — read-only is sufficient for a test job.
    permissions:
      contents: read

    services:
      postgres:
        # Pin to a specific digest so the image cannot be silently replaced.
        # Renovate will keep this digest current.
        image: postgres:16@sha256:ec96ede85a41e24eab45be6e20f7ac1b6a32e39d84cf7e90ab016e52a7deac9c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    # StepSecurity Harden Runner: monitors outbound network calls and blocks
    # unexpected egress. Using "audit" mode (monitor-only) to avoid breaking
    # existing installs. Switch to egress-policy: block once the allowed-endpoints
    # list is stable.
    - name: Harden Runner
      uses: step-security/harden-runner@0d381219ddf674d61a7572ddd19d7941e271515c  # v2.9.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Ruby
      uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005  # v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true

    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version-file: .node-version

    - name: Install system dependencies
      run: |
        sudo apt-get -yqq install libpq-dev build-essential libcurl4-openssl-dev

    - name: Install Ruby gems
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: Install Node packages
      run: yarn install

    - name: Set up database
      env:
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: postgres
        RAILS_ENV: test
      run: bin/rails db:setup

    - name: Run tests
      env:
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: postgres
        RAILS_ENV: test
      run: bin/rails test
