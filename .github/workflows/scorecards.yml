name: OpenSSF Scorecard

# Run on push to main and weekly to ensure the security posture score
# stays visible even without code changes.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'  # 01:30 UTC every Sunday
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to GitHub Security tab
      security-events: write
      # Required for private repos to access check run details
      checks: read
      # Required by ossf/scorecard-action to read the repository
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0d381219ddf674d61a7572ddd19d7941e271515c  # v2.9.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the public OpenSSF dashboard.
          # Remove or set to false for fully private repos.
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0952a80decea52ce9d6031fc0693720942efef47  # v3.28.1
        with:
          sarif_file: results.sarif
